version: "3.8"

services:
  frontend:
    build:
      context: ./dice-game-frontend
      dockerfile: Dockerfile
    image: my-frontend
    ports:
      - target: 3000
        published: 3000
        mode: host
    networks:
      - app-network
    depends_on:
      - backend-express

  backend-express:
    build:
      context: ./dice-game-backend
      dockerfile: Dockerfile
    image: my-backend-express
    ports:
      - target: 3001
        published: 3001
        mode: host
    networks:
      - app-network
    environment:
      - DATABASE_URL=mysql://root:root@mysql-db:3306/dice_game
    depends_on:
      - mysql-db

  backend-django:
    build:
      context: ./deConfig/
      dockerfile: Dockerfile
    image: my-backend-django
    ports:
      - target: 8000
        published: 8000
        mode: host
    networks:
      - app-network
    environment:
      - DATABASE_URL=mysql://root:root@mysql-db:3306/dice_game
    depends_on:
      - mysql-db

  mysql-db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: mysql-db
    ports:
      - target: 3306
        published: 3306
        mode: host
    networks:
      - app-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dice_game
      - MYSQL_PASSWORD=root

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
